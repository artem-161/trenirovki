<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Тренировки</title>
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Тренировки">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>try{var a=localStorage.getItem("trenirovki.accent");if(a&&a!=="orange")document.documentElement.dataset.accent=a}catch(e){}</script>
</head>
<body>
  <div id="view"></div>

  <nav id="tabbar">
    <button data-act="tab" data-tab="stats"><span class="ti">📈</span><span>Прогресс</span></button>
    <button data-act="tab" data-tab="settings"><span class="ti">⚙️</span><span>Настройки</span></button>
  </nav>

  <div id="sheet"></div>
  <div id="toast"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="config.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
